server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers (also applied to error responses via "always") ---
    # Everything the app needs is same-origin; the regex tester uses a same-origin module worker.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), clipboard-write=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Caching is set per location with "expires" (not add_header) so the headers above are always inherited
    # and there is exactly one Cache-Control header per response.

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets can be cached for a long time. "expires" avoids add_header,
    # so the security headers above are still inherited.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Operator-managed list of external tools (bind-mounted from ./config, see README).
    # Never cached so edits show up on the next page load; a missing file is a plain 404, not the SPA page.
    location /config/ {
        expires -1;
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to index.html (client-side routing). Always revalidated.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
